<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* ─────────────────────────────────────
   RESET & BASE
───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #c8a45a;
  --gold-soft:   rgba(200,164,90,0.22);
  --gold-border: rgba(200,164,90,0.3);
  --cream:       #f0ece3;
  --dim:         rgba(240,236,227,0.38);
  --bg:          #080608;
  --surface:     rgba(8,6,8,0.82);
  --danger:      #d97070;
  --radius:      3px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  overflow: hidden; /* lock scroll when on password screen */
}

/* ─────────────────────────────────────
   ANIMATED BACKGROUND
───────────────────────────────────── */
#bg-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

/* grain */
.grain {
  position: fixed; inset: 0; z-index: 998; pointer-events: none; opacity: 0.05;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  animation: grainAnim 0.09s steps(1) infinite;
}
@keyframes grainAnim {
  0%  { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); }
  50% { transform: translate(1px,-2px); }
  75% { transform: translate(-1px,2px); }
}

/* star canvas */
#star-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}

/* ─────────────────────────────────────
   LOCK SCREEN
───────────────────────────────────── */
#lock-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem;
  transition: opacity 1s cubic-bezier(0.4,0,0.2,1),
              transform 1s cubic-bezier(0.4,0,0.2,1),
              visibility 1s;
}
#lock-screen.hidden {
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: scale(1.04);
}

/* card */
.card {
  position: relative; z-index: 10;
  width: min(400px, 92vw);
  padding: 3.2rem 2.8rem 2.8rem;
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: 6px;
  backdrop-filter: blur(40px) saturate(1.5);
  -webkit-backdrop-filter: blur(40px) saturate(1.5);
  display: flex; flex-direction: column; align-items: center; gap: 1.6rem;
  animation: cardIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.2s both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(36px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* shimmer top edge */
.card::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* card glow */
.card::after {
  content: '';
  position: absolute; inset: -60px; z-index: -1; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(200,164,90,0.09) 0%, transparent 68%);
  pointer-events: none;
}

/* lock icon */
.lock-icon {
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--gold-border);
  background: var(--gold-soft);
  display: flex; align-items: center; justify-content: center;
  animation: iconPulse 3.5s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(200,164,90,0); }
  50%      { box-shadow: 0 0 0 10px rgba(200,164,90,0.07); }
}
.lock-icon svg { width: 20px; height: 20px; stroke: var(--gold); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* headline */
.headline { text-align: center; }
.headline h1 {
  font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
  font-size: clamp(1.4rem,5vw,1.85rem); letter-spacing: 0.02em; line-height: 1.3;
  background: linear-gradient(150deg, #f5edd8 30%, #c9a55a 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.headline p {
  margin-top: 0.5rem; font-size: 0.68rem;
  color: var(--dim); letter-spacing: 0.18em; text-transform: uppercase;
}

/* divider */
.divider {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,164,90,0.25), transparent);
}

/* input */
.input-wrap { position: relative; width: 100%; }
.input-wrap input {
  width: 100%;
  padding: 0.9rem 3rem 0.9rem 1.2rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-bottom: 1px solid rgba(200,164,90,0.4);
  border-radius: var(--radius);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif; font-size: 0.9rem; font-weight: 300;
  letter-spacing: 0.1em; outline: none;
  transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
}
.input-wrap input::placeholder { color: var(--dim); letter-spacing: 0.12em; }
.input-wrap input:focus {
  border-color: rgba(200,164,90,0.55);
  background: rgba(200,164,90,0.04);
  box-shadow: 0 0 0 3px rgba(200,164,90,0.07);
}
.input-wrap input.shake { animation: shake 0.42s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  15%     { transform: translateX(-9px); }
  35%     { transform: translateX(9px); }
  55%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
  90%     { transform: translateX(-3px); }
}

.eye-btn {
  position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--dim); transition: color 0.2s; display: flex; align-items: center;
}
.eye-btn:hover { color: var(--gold); }
.eye-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* error */
.error-msg {
  font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--danger); height: 0.8em; opacity: 0;
  transition: opacity 0.2s;
}
.error-msg.show { opacity: 1; }

/* submit */
.submit-btn {
  position: relative; overflow: hidden;
  width: 100%; padding: 0.9rem;
  background: transparent;
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  color: var(--gold);
  font-family: 'Montserrat', sans-serif; font-size: 0.7rem; font-weight: 400;
  letter-spacing: 0.28em; text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
}
.submit-btn:hover {
  border-color: rgba(200,164,90,0.7); color: var(--cream);
  box-shadow: 0 0 24px rgba(200,164,90,0.15), inset 0 0 16px rgba(200,164,90,0.05);
}
.submit-btn:active { transform: scale(0.985); }
/* shimmer sweep */
.submit-btn::after {
  content: '';
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(200,164,90,0.2), transparent);
  transform: skewX(-18deg);
  animation: sweep 3.5s ease-in-out infinite;
}
@keyframes sweep { 0%,100%{left:-100%} 55%{left:160%} }

/* ─────────────────────────────────────
   CONTENT / IMAGE SCREEN
───────────────────────────────────── */
#content {
  position: fixed; inset: 0; z-index: 50;
  background: #050405;
  display: flex; flex-direction: column;
  align-items: center;
  opacity: 0; visibility: hidden;
  overflow-y: auto;
  transition: opacity 1.2s ease 0.2s, visibility 0s 1.4s;
}
#content.visible {
  opacity: 1; visibility: visible;
  transition: opacity 1.2s ease 0.2s, visibility 0s 0s;
}
/* allow body scroll once content is shown */
#content.visible ~ * { overflow: auto; }

.image-wrap {
  position: relative;
  min-height: 100vh;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 3rem 1.5rem 5rem;
}

/* subtle vignette frame */
.image-wrap::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
}

.reveal-img {
  position: relative; z-index: 1;
  max-width: min(900px, 100%);
  width: 100%;
  height: auto;
  display: block;
  border-radius: 4px;
  box-shadow:
    0 0 0 1px rgba(200,164,90,0.15),
    0 40px 100px rgba(0,0,0,0.85),
    0 0 60px rgba(200,164,90,0.06);
  animation: imgFadeIn 1.4s cubic-bezier(0.22,1,0.36,1) 0.5s both;
  object-fit: contain;
}
@keyframes imgFadeIn {
  from { opacity: 0; transform: scale(0.97); filter: blur(4px); }
  to   { opacity: 1; transform: scale(1);    filter: blur(0);   }
}

/* lock-again button */
.lock-again {
  position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 300;
  background: rgba(8,6,8,0.75);
  border: 1px solid rgba(200,164,90,0.25);
  border-radius: 100px;
  padding: 0.45rem 1.2rem;
  color: var(--dim);
  font-family: 'Montserrat', sans-serif; font-size: 0.62rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer; backdrop-filter: blur(12px);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  display: none;
}
.lock-again.show { display: block; }
.lock-again:hover { color: var(--gold); border-color: rgba(200,164,90,0.5); background: rgba(8,6,8,0.9); }
</style>
</head>
<body>

<!-- BG LAYERS -->
<canvas id="bg-canvas"></canvas>
<canvas id="star-canvas"></canvas>
<div class="grain"></div>

<!-- ══ LOCK SCREEN ══ -->
<div id="lock-screen">
  <div class="card">

    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>

    <div class="headline">
      <h1>Enter password to open site</h1>
      <p>Hint: your names</p>
    </div>

    <div class="divider"></div>

    <div class="input-wrap">
      <input type="password" id="pw-input" placeholder="Password…" autocomplete="off"/>
      <button class="eye-btn" id="eye-btn" aria-label="Toggle password visibility">
        <svg id="eye-icon" viewBox="0 0 24 24" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <p class="error-msg" id="error-msg">Wrong password — try again</p>

    <button class="submit-btn" id="submit-btn">Unlock</button>

  </div>
</div>

<!-- ══ CONTENT SCREEN ══ -->
<div id="content">
  <div class="image-wrap">
    <!--
      IMAGE SOURCE:
      Replace the src below with any image URL you want to reveal.
      Current: https://files.catbox.moe/qhuvj9.png
    -->
    <img
      class="reveal-img"
      src="https://files.catbox.moe/iwyo3f.png"
      alt="Revealed image"
      loading="eager"
    />
  </div>
</div>

<!-- lock-again pill -->
<button class="lock-again" id="lock-again-btn">🔒 Lock again</button>

<script>
/* ════════════════════════════════════
   1. AURORA BACKGROUND
════════════════════════════════════ */
(function () {
  const c   = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W, H;

  const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  resize();
  addEventListener('resize', resize);

  const orbs = [
    { x: .22, y: .38, vx: .00014, vy: .00009, r: .7,  rgb: [140, 70, 210] },
    { x: .78, y: .58, vx:-.00011, vy: .00013, r: .65, rgb: [200, 130, 50]  },
    { x: .50, y: .08, vx: .00008, vy: .00016, r: .58, rgb: [50,  120, 210] },
    { x: .08, y: .80, vx: .00015, vy:-.00010, r: .50, rgb: [210, 70,  110] },
    { x: .90, y: .20, vx:-.00010, vy: .00012, r: .46, rgb: [40,  190, 155] },
  ];

  function draw() {
    ctx.fillStyle = '#080608';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';

    orbs.forEach(o => {
      const cx  = o.x * W, cy = o.y * H;
      const rad = Math.min(W, H) * o.r;
      const [r, g, b] = o.rgb;
      const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g2.addColorStop(0,   `rgba(${r},${g},${b},0.22)`);
      g2.addColorStop(0.45,`rgba(${r},${g},${b},0.09)`);
      g2.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();

      o.x += o.vx; o.y += o.vy;
      if (o.x < 0 || o.x > 1) o.vx *= -1;
      if (o.y < 0 || o.y > 1) o.vy *= -1;
      o.x = Math.max(0, Math.min(1, o.x));
      o.y = Math.max(0, Math.min(1, o.y));
    });

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ════════════════════════════════════
   2. TWINKLING STARS
════════════════════════════════════ */
(function () {
  const c   = document.getElementById('star-canvas');
  const ctx = c.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = c.width = innerWidth;
    H = c.height = innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x:     Math.random(),
      y:     Math.random(),
      r:     Math.random() * 1.2 + 0.15,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.009 + 0.004,
      warm:  Math.random() < 0.18,
    }));
  }
  resize();
  addEventListener('resize', resize);

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t++;
    stars.forEach(s => {
      const a = 0.12 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.warm
        ? `rgba(220,185,110,${a})`
        : `rgba(255,250,238,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ════════════════════════════════════
   3. PASSWORD LOGIC
════════════════════════════════════ */

// ── PASSWORD IS SET HERE ──
const PASSWORD = 'babybackchod';

const lockScreen  = document.getElementById('lock-screen');
const content     = document.getElementById('content');
const input       = document.getElementById('pw-input');
const errorMsg    = document.getElementById('error-msg');
const submitBtn   = document.getElementById('submit-btn');
const eyeBtn      = document.getElementById('eye-btn');
const eyeIcon     = document.getElementById('eye-icon');
const lockAgain   = document.getElementById('lock-again-btn');

/* — Eye toggle — */
eyeBtn.addEventListener('click', () => {
  const hidden = input.type === 'password';
  input.type   = hidden ? 'text' : 'password';
  eyeIcon.innerHTML = hidden
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
               a18.45 18.45 0 0 1 5.06-5.94"/>
       <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
               a18.5 18.5 0 0 1-2.16 3.19"/>
       <line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
       <circle cx="12" cy="12" r="3"/>`;
});

/* — Attempt — */
function attempt() {
  const val = input.value.trim().toLowerCase();

  if (val === PASSWORD.toLowerCase()) {
    /* correct */
    lockScreen.classList.add('hidden');
    setTimeout(() => {
      content.classList.add('visible');
      lockAgain.classList.add('show');
      document.body.style.overflow = 'hidden'; /* content div scrolls itself */
    }, 300);

  } else {
    /* wrong */
    errorMsg.classList.add('show');
    input.classList.remove('shake');
    void input.offsetWidth;           /* reflow to restart animation */
    input.classList.add('shake');
    input.value = '';
    input.focus();
  }
}

submitBtn.addEventListener('click', attempt);
input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
input.addEventListener('input',   () => errorMsg.classList.remove('show'));

/* — Lock again — */
lockAgain.addEventListener('click', () => location.reload());
</script>
</body>
</html>
